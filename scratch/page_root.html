<script type="text/javaScript" language="javascript">

	function fn_logout(){

		var cookie = document.cookie;

		var expdate = new Date();
		expdate.setDate(expdate.getDate() - 1); // cookie delete where

		if( cookie.length > 0 ){

			document.cookie = "_SLTS=; path=/; expires=" + expdate.toGMTString();
			document.cookie = "_SLTK=; path=/; expires=" + expdate.toGMTString();
			document.cookie = "_SLT=; path=/; expires=" + expdate.toGMTString();
			document.cookie = "secu=; path=/; expires=" + expdate.toGMTString();

		}

	}

</script>
